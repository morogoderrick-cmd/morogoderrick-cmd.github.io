<style>
:root{--bg:#0a0a0a;--panel:#141414;--line:#262626;--tx:#f5f5f5;--mut:#8a8a8a;--red:#e11d2e;--red2:#ff3b4a;--bg2:#0f0f0f;--bd:#3a3a3a;--tint:#2a0a0e;--ok:#7ddc9a;--warn:#f5b84a;--blue:#7fb2ff;color-scheme:dark}
:root[data-theme=light]{--bg:#fafaf7;--panel:#fff;--line:#e4e4df;--tx:#161616;--mut:#5f5f5f;--red2:#c4121f;--bg2:#f3f3ee;--bd:#cfcfc8;--tint:#fde8ea;--ok:#12703a;--warn:#8a5a00;--blue:#1a4fb4;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;font-weight:600}
.logo{font-size:24px;text-decoration:none;color:inherit}.lt:after{content:'.';color:var(--red)}.logo{display:inline-flex;align-items:center;gap:10px}.lm{width:32px;height:32px;border-radius:9px;flex:none}
.mut{color:var(--mut)}.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.btn{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:none;border:1px solid var(--bd);color:var(--tx)}.btn.ghost:hover{border-color:var(--red)}
.btn.wa{background:#128c4a}.btn.sm{padding:8px 14px;font-size:13px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 13px;font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,29,46,.25)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.msg{font-size:13px;min-height:18px}.msg.err{color:var(--red2)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(400px,100%);padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px -30px rgba(225,29,46,.35)}
.login h1{font-size:26px}

/* shell */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 4vw;background:var(--panel);border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;color:var(--mut);font:600 14px 'Plus Jakarta Sans',system-ui,sans-serif;padding:8px 14px;border-radius:9px;cursor:pointer}
.tab[aria-selected=true]{background:var(--tint);color:var(--tx)}
.ibtn{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer}
.ibtn:hover{border-color:var(--red)}
main{max-width:1040px;margin:0 auto;padding:24px 4vw 80px}
.banner{border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:rgba(245,184,74,.12);border:1px solid var(--warn);color:var(--tx)}
.banner.err{background:rgba(225,29,46,.12);border:1px solid var(--red)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}.stat b{display:block;font:600 30px Fraunces,Georgia,serif;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.stat.hot b{color:var(--red2)}
.toolbar{display:grid;grid-template-columns:1fr 170px auto;gap:10px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:6px 14px;font:500 13px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--red);background:var(--tint)}
.chip small{color:var(--mut);margin-left:4px}

/* messages */
.msgs{display:grid;gap:10px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.m.new{border-left:3px solid var(--red)}
.mh{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:14px 16px;cursor:pointer}
.mh:hover{background:var(--bg2)}
.who{min-width:0;flex:1 1 260px}.who b{display:block}.subj{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.pill.s-new{color:var(--red2);border-color:var(--red)}.pill.s-contacted{color:var(--blue);border-color:var(--blue)}.pill.s-closed{color:var(--ok);border-color:var(--ok)}
.pill.late{color:var(--warn);border-color:var(--warn)}
.age{font-size:13px;color:var(--mut);white-space:nowrap}
.mb{padding:4px 16px 18px;border-top:1px solid var(--line)}
.body{white-space:pre-wrap;word-break:break-word;font:inherit;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--tx);padding:8px 14px;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer}
.seg button+button{border-left:1px solid var(--bd)}.seg button[aria-pressed=true]{background:var(--red);color:#fff}
.note{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.empty{text-align:center;padding:50px 0}

/* vacancies */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px}
.ok{color:var(--ok)}.no{color:var(--warn)}
@media(max-width:720px){.toolbar{grid-template-columns:1fr}.top{padding:10px 4vw}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<script src="config.js"></script>
</head>
<body>

<div id="login" class="login" hidden>
  <form id="loginForm" class="card" autocomplete="on">
    <a class="logo" href="./" aria-label="Residia home"><img class="lm" src="logo-mark.svg" alt="" width="32" height="32"><span class="lt">Residia</span></a>
    <h1>Staff sign in</h1>
    <p class="mut">Managers and admins only.</p>
    <label class="vh" for="email">Email</label>
    <input id="email" type="email" required autocomplete="email" placeholder="Email" />
    <label class="vh" for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password" placeholder="Password" />
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
    <div id="loginMsg" class="msg" role="status" aria-live="polite"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <a class="logo" href="./" aria-label="Residia home"><img class="lm" src="logo-mark.svg" alt="" width="32" height="32"><span class="lt">Residia</span></a>
    <div class="tabs" role="tablist" aria-label="Admin sections">
      <button class="tab" role="tab" id="tabBtnEnq" data-tab="enq" aria-selected="true" aria-controls="tabEnq">Enquiries <span id="newCount"></span></button>
      <button class="tab" role="tab" id="tabBtnVac" data-tab="vac" aria-selected="false" aria-controls="tabVac">Vacancies</button>
    </div>
    <span class="sp"></span>
    <small class="mut" id="updated"></small>
    <button class="ibtn" id="refreshBtn" type="button">Refresh</button>
    <a class="ibtn" id="portalLink" href="#" style="text-decoration:none">Full portal</a>
    <button class="ibtn" id="themeBtn" type="button" aria-label="Switch to light mode" title="Switch to light mode">☀</button>
    <button class="ibtn" id="signOut" type="button">Sign out</button>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>

    <section id="tabEnq" role="tabpanel" aria-labelledby="tabBtnEnq">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div><label class="vh" for="q">Search enquiries</label><input id="q" type="search" placeholder="Search name, phone, subject or message" /></div>
        <div><label class="vh" for="fStatus">Status</label>
          <select id="fStatus"><option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="closed">Closed</option></select></div>
        <button class="btn ghost" id="exportBtn" type="button">Export CSV</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
      <div id="list" class="msgs" aria-live="polite"></div>
    </section>

    <section id="tabVac" role="tabpanel" aria-labelledby="tabBtnVac" hidden>
      <div class="stats" id="vstats"></div>
      <p class="mut" style="margin-bottom:14px">Listings with photos, a description, area notes and a video tour get more enquiries. Add what's missing from the portal, then refresh.</p>
      <div class="card tw"><table>
        <thead><tr><th>Property</th><th>Unit</th><th>Type</th><th>Rent</th><th>Photos</th><th>Description</th><th>Area notes</th><th>Video</th><th>Verified</th></tr></thead>
        <tbody id="vbody"></tbody>
      </table></div>
    </section>
  </main>
</div>

<script>
const CONFIG = Object.assign({ API_URL: 'http://localhost:5000/api', PORTAL_URL: 'http://localhost:5173', TIMEOUT_MS: 12000 }, window.RESIDIA_CONFIG || {});
// Endpoint shapes for your backend. Override with an ADMIN: {...} block in config.js.
const AD = Object.assign({ list: '/messages', update: '/messages/{id}', updateMethod: 'PATCH', roles: ['admin', 'manager'] }, CONFIG.ADMIN || {});

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => 'KES ' + Number(n || 0).toLocaleString();

/* ---------- session ---------- */
let TOKEN = '';
try { TOKEN = sessionStorage.getItem('residia_admin_token') || localStorage.getItem('residia_token') || ''; } catch (e) {}
function signOut(msg, full) {
  TOKEN = ''; try { sessionStorage.removeItem('residia_admin_token'); if (full) localStorage.removeItem('residia_token'); } catch (e) {}
  MSGS = []; showLogin(msg || '');
}
function showLogin(msg) {
  $('#app').hidden = true; $('#login').hidden = false;
  const m = $('#loginMsg'); m.className = 'msg' + (msg ? ' err' : ''); m.textContent = msg || '';
  document.title = 'Staff sign in — Residia admin';
}
function showApp() { $('#login').hidden = true; $('#app').hidden = false; }

/* ---------- api ---------- */
async function api(path, opts, auth) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  const headers = { 'Content-Type': 'application/json' };
  if (auth !== false && TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  try {
    const r = await fetch(CONFIG.API_URL + path, Object.assign({ headers: headers, signal: ctrl.signal }, opts));
    const text = await r.text(); let d = {}; try { d = text ? JSON.parse(text) : {}; } catch (x) { d = {}; }
    if (!r.ok) { const err = new Error(d.message || 'Request failed (' + r.status + ')'); err.status = r.status; throw err; }
    return d;
  } finally { clearTimeout(timer); }
}
const friendly = (e) => e.name === 'AbortError' ? 'The server took too long to respond.' : (/fetch|network|load failed/i.test(e.message) ? "Can't reach the server. Is the backend running?" : e.message);

/* ---------- data ---------- */
let MSGS = [], VACANT = [], VIEW = 'enq', LAST = null, LOCAL = {}, OPEN = new Set(), DRAFT = {};
const F = { q: '', status: '', type: '' };
try { LOCAL = JSON.parse(localStorage.getItem('residia_admin_local') || '{}') || {}; } catch (e) { LOCAL = {}; }
const saveLocal = () => { try { localStorage.setItem('residia_admin_local', JSON.stringify(LOCAL)); } catch (e) {} };

const TYPES = [
  { key: 'viewing', label: 'Viewing requests', test: /^viewing request/i },
  { key: 'owner', label: 'Owner leads', test: /property management quote/i },
  { key: 'alert', label: 'Vacancy alerts', test: /^(vacancy alert|ombi la taarifa)/i },
  { key: 'unit', label: 'Unit enquiries', test: /^(viewing:|kuangalia:)/i },
  { key: 'reset', label: 'Password resets', test: /^(password reset|ombi la kubadilisha)/i },
  { key: 'general', label: 'General', test: /./ }
];
const typeOf = (s) => (TYPES.find((t) => t.test.test(String(s || '').trim())) || TYPES[TYPES.length - 1]).key;
const typeLabel = (k) => (TYPES.find((t) => t.key === k) || {}).label || k;
const normPhone = (v) => { v = String(v || '').replace(/[\s-]/g, ''); return /^(\+?254|0)?[17]\d{8}$/.test(v) ? '254' + v.slice(-9) : ''; };
function findPhone(body) {
  const a = body.match(/(?:phone|simu)\s*:\s*([+\d][\d\s-]{7,})/i); if (a) return a[1].trim();
  const b = body.match(/(\+?254[\s-]?[17]\d{2}[\s-]?\d{3}[\s-]?\d{3}|0[17]\d{2}[\s-]?\d{3}[\s-]?\d{3})/); return b ? b[1].trim() : '';
}
const findEmail = (body) => { const m = body.match(/(?:email|barua pepe)\s*:\s*([^\s@]+@[^\s@]+\.[^\s@]+)/i); return m ? m[1] : ''; };

function normMsg(m) {
  const id = String(m._id || m.id || ''), body = String(m.body || m.message || ''), subject = String(m.subject || '');
  const loc = LOCAL[id] || {};
  const status = loc.status || m.status || (m.read === true ? 'contacted' : 'new');
  return { id: id, name: m.fromName || m.name || 'Unknown', subject: subject, body: body, at: m.createdAt || m.date || m.created_at || null,
    status: ['new', 'contacted', 'closed'].indexOf(status) > -1 ? status : 'new', note: loc.note != null ? loc.note : (m.note || ''),
    type: typeOf(subject), phone: findPhone(body), email: findEmail(body) };
}
const when = (m) => { const t = m.at ? new Date(m.at).getTime() : 0; return isNaN(t) ? 0 : t; };
function ago(ts) {
  if (!ts) return '—'; const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' d ago'; return new Date(ts).toLocaleDateString();
}
const isLate = (m) => m.status === 'new' && when(m) && Date.now() - when(m) > 24 * 3600 * 1000;

async function loadMessages(silent) {
  try {
    const d = await api(AD.list);
    const arr = Array.isArray(d) ? d : (d.messages || d.data || d.items || []);
    MSGS = arr.map(normMsg).sort((a, b) => when(b) - when(a)); LAST = new Date(); setBanner('');
    showApp();
  } catch (e) {
    if (e.status === 401 || e.status === 403) { signOut(TOKEN ? 'Your session has ended or this account can\'t view enquiries. Please sign in again.' : ''); return false; }
    if (!silent) setBanner('err', 'Couldn\'t load enquiries: ' + friendly(e));
    showApp();
  }
  render(); return true;
}

/* ---------- saving status / notes ---------- */
async function patchMsg(id, patch) {
  const m = MSGS.find((x) => x.id === id); if (!m) return;
  Object.assign(m, patch);
  try {
    await api(AD.update.replace('{id}', encodeURIComponent(id)), { method: AD.updateMethod, body: JSON.stringify(patch) });
    if (LOCAL[id]) { delete LOCAL[id]; saveLocal(); }
  } catch (e) {
    if (e.status === 401 || e.status === 403) { signOut('Your session has ended. Please sign in again.'); return; }
    LOCAL[id] = Object.assign(LOCAL[id] || {}, patch); saveLocal();
    setBanner('warn', 'Saved on this device only: the server didn\'t accept the change (' + friendly(e) + ').');
  }
  render();
}
async function retrySync() {
  const ids = Object.keys(LOCAL); let left = 0;
  for (const id of ids) {
    try { await api(AD.update.replace('{id}', encodeURIComponent(id)), { method: AD.updateMethod, body: JSON.stringify(LOCAL[id]) }); delete LOCAL[id]; }
    catch (e) { left++; }
  }
  saveLocal(); setBanner(left ? 'warn' : '', left ? left + ' change(s) still couldn\'t be saved to the server.' : ''); render();
}
let NOTICE = null;
function setBanner(kind, text) { NOTICE = kind ? { kind: kind, text: text } : null; drawBanner(); }
function drawBanner() {
  const b = $('#banner'), pending = Object.keys(LOCAL).length; let n = NOTICE;
  if (!n && pending) n = { kind: 'warn', text: pending + ' change(s) are saved on this device only. The server hasn\'t accepted them yet.' };
  if (!n) { b.hidden = true; b.innerHTML = ''; return; }
  b.className = 'banner ' + n.kind; b.hidden = false;
  b.innerHTML = '<span>' + esc(n.text) + '</span>' + (pending ? '<button class="btn ghost sm" type="button" data-sync>Try saving to server</button>' : '');
}

/* ---------- render: enquiries ---------- */
function filtered() {
  const q = F.q.trim().toLowerCase();
  return MSGS.filter((m) => (!F.status || m.status === F.status) && (!F.type || m.type === F.type) &&
    (!q || (m.name + ' ' + m.subject + ' ' + m.body + ' ' + m.phone).toLowerCase().indexOf(q) > -1));
}
function waText(m) {
  const first = String(m.name).split(' ')[0];
  if (m.type === 'viewing') return 'Hello ' + first + ', thanks for requesting a viewing with Residia. We would like to confirm your slot. Are you still available?';
  if (m.type === 'owner') return 'Hello ' + first + ', thanks for your interest in having Residia manage your property. When is a good time to talk?';
  if (m.type === 'alert') return 'Hello ' + first + ', Residia here. We have a unit that may suit what you asked for. Would you like the details?';
  return 'Hello ' + first + ', this is Residia following up on your enquiry: "' + m.subject + '". How can we help?';
}
function msgHtml(m) {
  const open = OPEN.has(m.id), wa = normPhone(m.phone), id = esc(m.id);
  const actions = (wa ? '<a class="btn sm" href="tel:+' + wa + '">Call</a><a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/' + wa + '?text=' + encodeURIComponent(waText(m)) + '">WhatsApp</a><button class="btn ghost sm" type="button" data-copy="' + wa + '">Copy number</button>' : '<span class="mut" style="font-size:13px">No valid phone number found in this message.</span>') +
    (m.email ? '<a class="btn ghost sm" href="mailto:' + esc(m.email) + '?subject=' + encodeURIComponent('Re: ' + m.subject) + '">Email</a>' : '');
  const seg = ['new', 'contacted', 'closed'].map((s) => '<button type="button" data-status="' + s + '" data-id="' + id + '" aria-pressed="' + (m.status === s) + '">' + s[0].toUpperCase() + s.slice(1) + '</button>').join('');
  return '<article class="m ' + m.status + '" data-id="' + id + '"><button class="mh" type="button" data-toggle="' + id + '" aria-expanded="' + open + '">' +
    '<span class="who"><b>' + esc(m.name) + '</b><span class="subj">' + esc(m.subject) + '</span></span>' +
    '<span class="meta"><span class="pill">' + esc(typeLabel(m.type)) + '</span>' + (isLate(m) ? '<span class="pill late">24h+ waiting</span>' : '') +
    '<span class="pill s-' + m.status + '">' + m.status[0].toUpperCase() + m.status.slice(1) + '</span><span class="age" title="' + esc(m.at ? new Date(m.at).toLocaleString() : '') + '">' + esc(ago(when(m))) + '</span></span></button>' +
    '<div class="mb"' + (open ? '' : ' hidden') + '><pre class="body">' + esc(m.body) + '</pre>' +
    '<div class="row">' + actions + '</div>' +
    '<div class="row"><div class="seg" role="group" aria-label="Status">' + seg + '</div></div>' +
    '<div class="note"><div><label class="vh" for="note-' + id + '">Internal note</label><textarea id="note-' + id + '" data-note="' + id + '" rows="2" maxlength="1000" placeholder="Internal note (only staff see this)">' + esc(DRAFT[m.id] != null ? DRAFT[m.id] : m.note) + '</textarea></div>' +
    '<button class="btn ghost sm" type="button" data-save-note="' + id + '">Save note</button></div></div></article>';
}
function render() {
  const n = MSGS.filter((m) => m.status === 'new').length, late = MSGS.filter(isLate).length;
  document.title = (n ? '(' + n + ') ' : '') + 'Enquiries — Residia admin';
  $('#newCount').textContent = n ? '(' + n + ')' : '';
  $('#updated').textContent = LAST ? 'Updated ' + LAST.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  $('#stats').innerHTML = [['New', n, n ? 'hot' : ''], ['Waiting 24h+', late, late ? 'hot' : ''], ['Contacted', MSGS.filter((m) => m.status === 'contacted').length, ''], ['Closed', MSGS.filter((m) => m.status === 'closed').length, ''], ['Total', MSGS.length, '']]
    .map((s) => '<div class="card stat ' + s[2] + '"><b>' + s[1] + '</b><span>' + s[0] + '</span></div>').join('');
  const counts = {}; MSGS.forEach((m) => { counts[m.type] = (counts[m.type] || 0) + 1; });
  $('#chips').innerHTML = '<button class="chip" type="button" data-type="" aria-pressed="' + (!F.type) + '">All<small>' + MSGS.length + '</small></button>' +
    TYPES.filter((t) => counts[t.key]).map((t) => '<button class="chip" type="button" data-type="' + t.key + '" aria-pressed="' + (F.type === t.key) + '">' + esc(t.label) + '<small>' + counts[t.key] + '</small></button>').join('');
  const list = filtered();
  $('#list').innerHTML = list.length ? list.map(msgHtml).join('') : '<p class="mut empty">' + (MSGS.length ? 'No enquiries match those filters.' : 'No enquiries yet. They will appear here as soon as someone uses the website forms.') + '</p>';
  drawBanner();
}

/* ---------- render: vacancies ---------- */
async function loadVacancies() {
  try { const d = await api('/units/vacant', {}, false); VACANT = Array.isArray(d) ? d : (d.units || []); } catch (e) { VACANT = []; $('#vbody').innerHTML = '<tr><td colspan="9" class="mut">Couldn\'t load vacancies: ' + esc(friendly(e)) + '</td></tr>'; $('#vstats').innerHTML = ''; return; }
  const imgs = (u) => (Array.isArray(u.images) && u.images.length ? u.images.length : (u.image ? 1 : 0));
  const area = (u) => u.neighbourhood || (u.property || {}).neighbourhood;
  const tick = (ok) => ok ? '<span class="ok" aria-label="Yes">✓</span>' : '<span class="no" aria-label="Missing">—</span>';
  const gaps = VACANT.filter((u) => !imgs(u) || !u.description || !area(u) || !u.video).length;
  $('#vstats').innerHTML = '<div class="card stat"><b>' + VACANT.length + '</b><span>Vacant units</span></div><div class="card stat ' + (gaps ? 'hot' : '') + '"><b>' + gaps + '</b><span>Missing details</span></div><div class="card stat"><b>' + VACANT.filter((u) => u.verified).length + '</b><span>Verified</span></div>';
  $('#vbody').innerHTML = VACANT.length ? VACANT.map((u) => { const p = u.property || {};
    return '<tr><td>' + esc(p.name) + '<br><small class="mut">' + esc(p.location) + '</small></td><td>' + esc(u.label) + '</td><td>' + esc(u.type || '') + '</td><td>' + money(u.rent) + '</td><td>' + (imgs(u) ? '<span class="ok">' + imgs(u) + '</span>' : tick(false)) + '</td><td>' + tick(!!u.description) + '</td><td>' + tick(!!area(u)) + '</td><td>' + tick(!!u.video) + '</td><td>' + tick(!!u.verified) + '</td></tr>'; }).join('')
    : '<tr><td colspan="9" class="mut">No vacant units right now.</td></tr>';
}

/* ---------- csv ---------- */
function exportCsv() {
  const cell = (v) => { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const rows = [['Received', 'Name', 'Phone', 'Email', 'Type', 'Subject', 'Status', 'Note', 'Message']].concat(filtered().map((m) => [m.at || '', m.name, m.phone, m.email, typeLabel(m.type), m.subject, m.status, m.note, m.body]));
  const blob = new Blob(['\ufeff' + rows.map((r) => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'residia-enquiries-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- events ---------- */
document.addEventListener('click', async (e) => {
  const tg = e.target.closest('[data-toggle]');
  if (tg) { const id = tg.dataset.toggle; OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); render(); const b = document.querySelector('[data-toggle="' + CSS.escape(id) + '"]'); if (b) b.focus(); return; }
  const st = e.target.closest('[data-status]');
  if (st) { const id = st.dataset.id, s = st.dataset.status; await patchMsg(id, { status: s }); const b = document.querySelector('[data-id="' + CSS.escape(id) + '"][data-status="' + s + '"]'); if (b) b.focus(); return; }
  const sn = e.target.closest('[data-save-note]');
  if (sn) { const id = sn.dataset.saveNote, ta = document.getElementById('note-' + id); delete DRAFT[id]; await patchMsg(id, { note: ta ? ta.value.trim() : '' }); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { try { await navigator.clipboard.writeText('+' + cp.dataset.copy); cp.textContent = 'Copied'; setTimeout(() => { cp.textContent = 'Copy number'; }, 1500); } catch (x) {} return; }
  const ty = e.target.closest('[data-type]'); if (ty) { F.type = ty.dataset.type; render(); return; }
  if (e.target.closest('[data-sync]')) { retrySync(); return; }
});
document.addEventListener('input', (e) => { if (e.target.matches('[data-note]')) { DRAFT[e.target.dataset.note] = e.target.value; $('#updated').textContent = 'Unsaved note: auto-refresh paused'; } });
$('#q').addEventListener('input', (e) => { F.q = e.target.value; render(); });
$('#fStatus').addEventListener('change', (e) => { F.status = e.target.value; render(); });
$('#exportBtn').addEventListener('click', exportCsv);
$('#refreshBtn').addEventListener('click', () => { loadMessages(); if (VIEW === 'vac') loadVacancies(); });
$('#signOut').addEventListener('click', () => signOut('', true));
document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
  VIEW = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  $('#tabEnq').hidden = VIEW !== 'enq'; $('#tabVac').hidden = VIEW !== 'vac';
  if (VIEW === 'vac') loadVacancies();
}));

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'), msg = $('#loginMsg'); msg.className = 'msg'; msg.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const d = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: $('#email').value.trim(), password: $('#password').value }) }, false);
    const role = String((d.user && d.user.role) || d.role || '').toLowerCase();
    if (role && AD.roles.indexOf(role) < 0) throw new Error("This account isn't allowed to open the admin area.");
    if (!d.token) throw new Error('Sign-in succeeded but no token was returned.');
    TOKEN = d.token; try { sessionStorage.setItem('residia_admin_token', TOKEN); } catch (x) {}
    $('#password').value = '';
    await loadMessages();
  } catch (err) { TOKEN = ''; msg.className = 'msg err'; msg.textContent = friendly(err); }
  btn.disabled = false; btn.textContent = 'Sign in';
});

/* ---------- theme ---------- */
const theme = () => document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
function paintTheme() { const b = $('#themeBtn'), l = theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'; b.textContent = theme() === 'light' ? '☾' : '☀'; b.setAttribute('aria-label', l); b.title = l; }
$('#themeBtn').addEventListener('click', () => { const n = theme() === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('residia_theme', n); } catch (e) {} paintTheme(); });

/* ---------- auto refresh (pauses while you are typing a note) ---------- */
setInterval(() => {
  if (!TOKEN || document.hidden || $('#app').hidden || Object.keys(DRAFT).length || document.activeElement && document.activeElement.matches('textarea,input')) return;
  loadMessages(true);
}, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && TOKEN && !$('#app').hidden && !Object.keys(DRAFT).length) loadMessages(true); });

/* ---------- start ---------- */
paintTheme(); $('#portalLink').href = CONFIG.PORTAL_URL;
(async () => { if (TOKEN) { if (await loadMessages(false)) return; } if ($('#app').hidden && $('#login').hidden) showLogin(''); })();
</script>
